name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFORJA_LTO=OFF -DFORJA_STANDALONE=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage installer payload
        shell: pwsh
        run: ./installer/collect_payload.ps1 -BuildRoot build -Clean

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ github.ref_name }}" installer\forja.iss
          Copy-Item installer/dist/Forja-*-windows-x64.exe ./

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/VST3 | Out-Null
          Get-ChildItem build -Recurse -Directory -Filter VST3 | ForEach-Object {
            Get-ChildItem $_.FullName -Filter *.vst3 | ForEach-Object {
              Copy-Item $_.FullName package/VST3/ -Recurse -Force
            }
          }
          Copy-Item docs/instalar/INSTALAR-WINDOWS.txt package/LEIA-ME.txt
          Compress-Archive -Path package/* -DestinationPath "Forja-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: forja-windows-x64
          path: |
            Forja-*-windows-x64.zip
            Forja-*-windows-x64.exe
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFORJA_LTO=OFF
          -DFORJA_STANDALONE=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p package/VST3
          find build -type d -name "*.vst3" -path "*_artefacts*" -exec cp -R {} package/VST3/ \;
          cp docs/instalar/INSTALAR-MACOS.txt package/LEIA-ME.txt
          cd package
          zip -qry "../Forja-${GITHUB_REF_NAME}-macos-universal.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: forja-macos-universal
          path: Forja-*-macos-universal.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev \
            libxi-dev \
            libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORJA_LTO=OFF -DFORJA_STANDALONE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p package/VST3
          find build -type d -name "*.vst3" -path "*_artefacts*" -exec cp -R {} package/VST3/ \;
          cp docs/instalar/INSTALAR-LINUX.txt package/LEIA-ME.txt
          cd package
          zip -qry "../Forja-${GITHUB_REF_NAME}-linux-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: forja-linux-x64
          path: Forja-*-linux-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
