name: Release

# Dois trens de release no mesmo repositorio, resolvidos por ci/products.json:
#   tag vX.Y.Z        -> a suite inteira (todos os 36 plugins num so pacote)
#   tag <prefixo>-X.Y.Z -> um produto so (ex.: vrack-1.0.0, vcanivete-1.0.0)
# Build e testes correm inteiros no Windows e no Linux, mesmo no trem de um
# produto: e o que impede que uma mexida em forja_ui quebre outro produto sem
# ninguem ver. So o empacotamento e filtrado (collect_payload.ps1 -OnlyPath).
# Excecao (documentada, medida): o job de macOS compila apenas os alvos do trem.
# O runner gratuito de macOS nao fecha os 36 plugins universais dentro do teto
# de 6 h do job -- as tentativas 3, 5 e 6 morreram em `cancelled` no step Build.
# Ver o job macos abaixo para os numeros da sonda e o que falta (fatiar).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou commit para reempacotar (ex.: vrack-1.0.0)"
        required: true
        default: main

permissions:
  contents: read

# Um trem por tag: a concurrency protege contra re-trigger acidental da MESMA
# tag, mas deixa trens DIFERENTES rodarem em paralelo. Com os shards de macOS,
# cada trem usa jobs curtos (30-60 min) que cabem no parque de runners de um
# repo publico sem saturar. O grupo global serializava e canibalizava os
# disparos simultaneos (runs #27-#32, 5/11/2026: 4 dos 6 tags nunca rodaram).
concurrency:
  group: release-train-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Lê ci/products.json e decide o que o trem empacota. Um job só, barato; os
  # outputs saem em bruto para os jobs de SO consumirem. Quando o trem declara
  # `packages`, o output homônimo sai como JSON array (`[{slug,display,
  # artifactBase,pathFilter,testRegex,readme}, ...]`); vazio ou ausente é `[]`.
  # Os jobs de SO trocam o empacotamento aggregate pelo loop 1-zip-por-plugin
  # quando o array vem não-vazio (doc em docs/RELEASES.md).
  resolve:
    name: Resolve release train
    runs-on: ubuntu-22.04
    outputs:
      kind: ${{ steps.pick.outputs.kind }}
      slug: ${{ steps.pick.outputs.slug }}
      product: ${{ steps.pick.outputs.product }}
      version: ${{ steps.pick.outputs.version }}
      artifactBase: ${{ steps.pick.outputs.artifactBase }}
      pathFilters: ${{ steps.pick.outputs.pathFilters }}
      testRegex: ${{ steps.pick.outputs.testRegex }}
      leiam: ${{ steps.pick.outputs.leiam }}
      packages: ${{ steps.pick.outputs.packages }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve train from tag
        id: pick
        shell: bash
        env:
          REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REF"

          # O produto e a chave cujo tagPrefix casa com a tag; o mais longo
          # ganha (vcanivete- casa antes de qualquer v- futuro). A suite e o
          # fallback: kind != product e tagPrefix ignorado.
          # O filtro por type antes de olhar .value.kind nao e decorativo: a
          # chave "_" do registro carrega um texto, e o jq ERRA ao indexar um
          # string (.value.kind) -- com set -e isso derruba o job.
          SLUG=$(jq -r --arg tag "$TAG" '
            to_entries
            | map(select(.value | type == "object"))
            | map(select(.value.kind == "product"))
            | map(select(.value.tagPrefix as $p | $tag | startswith($p)))
            | sort_by(.value.tagPrefix | length)
            | last // empty | .key' ci/products.json)

          if [ -n "$SLUG" ]; then
            KIND=product
            VERSION="${TAG#"$(jq -r --arg s "$SLUG" '.[$s].tagPrefix' ci/products.json)"}"
            PRODUCT=$(jq -r --arg s "$SLUG" '.[$s].display' ci/products.json)
            BASE=$(jq -r --arg s "$SLUG" '.[$s].artifactBase' ci/products.json)
            LEIAM=$(jq -r --arg s "$SLUG" '.[$s].readme' ci/products.json)
            FILTERS=$(jq -r --arg s "$SLUG" '.[$s].pathFilters | join(",")' ci/products.json)
            TESTREGEX=$(jq -r --arg s "$SLUG" '.[$s].testRegex' ci/products.json)
            # packages: sempre JSON valido, `[]` quando o trem nao declara. O
            # `// []` cobre chave ausente; `if type=="array"` cobre valor
            # malformado sem derrubar o job (o test_resolve.ps1 ja reprova).
            PACKAGES=$(jq -c --arg s "$SLUG" '
              (.[$s].packages // [])
              | if type == "array" then . else [] end' ci/products.json)
          else
            KIND=suite
            SLUG=suite
            VERSION="$TAG"
            PRODUCT=""
            BASE=$(jq -r '.suite.artifactBase' ci/products.json)
            LEIAM=$(jq -r '.suite.readme' ci/products.json)
            FILTERS=""
            TESTREGEX=$(jq -r '.suite.testRegex' ci/products.json)
            PACKAGES="[]"
          fi

          {
            echo "tag=$TAG"
            echo "kind=$KIND"
            echo "slug=$SLUG"
            echo "product=$PRODUCT"
            echo "version=$VERSION"
            echo "artifactBase=$BASE"
            echo "pathFilters=$FILTERS"
            echo "testRegex=$TESTREGEX"
            echo "leiam=$LEIAM"
            echo "packages=$PACKAGES"
          } >> "$GITHUB_OUTPUT"

          NPKGS=$(echo "$PACKAGES" | jq 'length')
          if [ "$NPKGS" -gt 0 ]; then
            echo "trem: $KIND ($SLUG) versao $VERSION -> empacotando $NPKGS packages, sem aggregate"
          else
            echo "trem: $KIND ($SLUG) versao $VERSION -> $BASE, filtros: ${FILTERS:-todos}"
          fi

  windows:
    name: Windows x64
    needs: resolve
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFORJA_LTO=OFF -DFORJA_STANDALONE=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # powershell (5.1) e o shell validado localmente para o coletor: o script
      # declara #Requires -Version 5.1 e o pwsh 7 do runner reprovou esta etapa
      # sem deixar ver o motivo no log anonimo. Mudar aqui exige repetir a
      # checagem local com o MESMO shell da CI.
      - name: Stage installer payload
        shell: powershell
        run: |
          $pkgsStr = '${{ needs.resolve.outputs.packages }}'
          $packages = @()
          if ($pkgsStr -and $pkgsStr -ne '[]') { $packages = [array]($pkgsStr | ConvertFrom-Json) }

          try {
            if ($packages.Count -gt 0) {
              # Trem com packages: um collect por plugin, cada payload
              # congelado em installer/staging/<slug>/payload para as duas
              # etapas seguintes (ISCC e zip) consumirem em ordem.
              $staging = 'installer/staging'
              if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
              New-Item -ItemType Directory -Force $staging | Out-Null
              foreach ($pkg in $packages) {
                Write-Host ("==> collect: " + $pkg.slug)
                & ./installer/collect_payload.ps1 -BuildRoot build -Clean `
                    -OnlyPath @($pkg.pathFilter) -LeiamE $pkg.readme 2>&1 |
                  Tee-Object -FilePath "payload-$($pkg.slug).log" | Out-Host
                if (-not $?) { throw "collect_payload[$($pkg.slug)] falhou" }
                $dst = Join-Path $staging $pkg.slug
                New-Item -ItemType Directory -Force $dst | Out-Null
                Copy-Item installer/payload (Join-Path $dst 'payload') -Recurse -Force
              }
            } else {
              $filters = '${{ needs.resolve.outputs.pathFilters }}'
              $splat = @{
                BuildRoot = 'build'
                Clean     = $true
                LeiamE    = '${{ needs.resolve.outputs.leiam }}'
              }
              if ($filters) { $splat['OnlyPath'] = @($filters -split ',') }
              & ./installer/collect_payload.ps1 @splat 2>&1 |
                Tee-Object -FilePath payload.log | Out-Host
              if (-not $?) { throw "collect_payload.ps1 terminou com sucesso falso" }
            }
          } catch {
            $msg = ("{0}: {1}" -f $_.Exception.GetType().FullName, $_.Exception.Message)
            $msg = $msg -replace '%', '%25' -replace "`r|`n", ' '
            Write-Host "::error::payload falhou -- $msg"
            $linha = ($_.ScriptStackTrace -split "`n" | Select-Object -First 3) -join ' | '
            Write-Host "::error::origem: $($linha -replace '%', '%25')"
            exit 1
          }

      - name: Build Windows installer (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $kind = '${{ needs.resolve.outputs.kind }}'
          $version = '${{ needs.resolve.outputs.version }}'
          $pkgsStr = '${{ needs.resolve.outputs.packages }}'
          $packages = @()
          if ($pkgsStr -and $pkgsStr -ne '[]') { $packages = [array]($pkgsStr | ConvertFrom-Json) }

          if ($packages.Count -gt 0) {
            # Um .exe por package: restaura o payload daquele slug, roda o
            # ISCC com ProductName/Version proprios, e renomeia o exe para
            # <artifactBase>-<versao>-windows-x64.exe (o mesmo padrao do zip,
            # garantindo que o glob Forja*.exe da etapa de upload pegue).
            foreach ($pkg in $packages) {
              if (Test-Path installer/payload) { Remove-Item installer/payload -Recurse -Force }
              Copy-Item "installer/staging/$($pkg.slug)/payload" installer/payload -Recurse -Force
              $defines = @(
                "/DAppVersion=${{ needs.resolve.outputs.tag }}",
                "/DProductName=$($pkg.display)",
                "/DProductVersion=$version"
              )
              & $iscc @defines installer\forja.iss 2>&1 |
                Tee-Object -FilePath "iscc-$($pkg.slug).log" | Out-Host
              if (-not $?) {
                $causa = Select-String -Path "iscc-$($pkg.slug).log" -Pattern '^Error' | Select-Object -Last 1
                Write-Host ("::error::ISCC[$($pkg.slug)] falhou -- {0}" -f ("$causa" -replace '%','%25'))
                exit 1
              }
              $exe = Get-ChildItem installer/dist -Filter *.exe |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $exe) { Write-Host "::error::ISCC[$($pkg.slug)] nao gerou .exe"; exit 1 }
              Move-Item $exe.FullName "./$($pkg.artifactBase)-$version-windows-x64.exe" -Force
            }
          } else {
            $defines = @("/DAppVersion=${{ needs.resolve.outputs.tag }}")
            if ($kind -eq 'product') {
              $defines += "/DProductName=${{ needs.resolve.outputs.product }}"
              $defines += "/DProductVersion=$version"
            }
            & $iscc @defines installer\forja.iss 2>&1 | Tee-Object -FilePath iscc.log | Out-Host
            if (-not $?) {
              $causa = Select-String -Path iscc.log -Pattern '^Error' | Select-Object -Last 1
              Write-Host ("::error::ISCC falhou -- {0}" -f ("$causa" -replace '%','%25'))
              exit 1
            }
            # O OutputBaseFilename do .iss usa o ProductName (ex.: "Drumforge",
            # "TRACO"), que nem sempre comeca com "Forja". Renomeia para
            # <artifactBase>-<versao>-windows-x64.exe -- o artifactBase e sempre
            # Forja<Nome>, casando com o glob de upload (Forja*.exe).
            $base = '${{ needs.resolve.outputs.artifactBase }}'
            $exe = Get-ChildItem installer/dist -Filter *.exe |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $exe) { Write-Host "::error::ISCC nao gerou .exe"; exit 1 }
            Move-Item $exe.FullName "./${base}-$version-windows-x64.exe" -Force
          }

      - name: Package
        shell: powershell
        run: |
          $version = '${{ needs.resolve.outputs.version }}'
          $pkgsStr = '${{ needs.resolve.outputs.packages }}'
          $packages = @()
          if ($pkgsStr -and $pkgsStr -ne '[]') { $packages = [array]($pkgsStr | ConvertFrom-Json) }

          if ($packages.Count -gt 0) {
            # Um .zip por package com a mesma cara do aggregate (VST3/ achatado
            # + LEIA-ME na raiz), so que lendo o payload congelado do staging.
            foreach ($pkg in $packages) {
              $src = "installer/staging/$($pkg.slug)/payload"
              if (Test-Path package) { Remove-Item package -Recurse -Force }
              New-Item -ItemType Directory -Force package/VST3 | Out-Null
              Get-ChildItem $src -Recurse -Directory -Filter *.vst3 | ForEach-Object {
                Copy-Item $_.FullName package/VST3/ -Recurse -Force
              }
              Copy-Item (Join-Path $src 'LEIA-ME.txt') package/LEIA-ME.txt -Force
              Compress-Archive -Path package/* -DestinationPath "$($pkg.artifactBase)-$version-windows-x64.zip" -Force
            }
          } else {
            New-Item -ItemType Directory -Force package/VST3 | Out-Null
            Get-ChildItem installer/payload -Recurse -Directory -Filter *.vst3 | ForEach-Object {
              Copy-Item $_.FullName package/VST3/ -Recurse -Force
            }
            Get-ChildItem installer/payload/LEIA-ME.txt | Copy-Item -Destination package/LEIA-ME.txt -Force
            Compress-Archive -Path package/* -DestinationPath "${{ needs.resolve.outputs.artifactBase }}-$version-windows-x64.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: forja-windows-x64
          path: |
            Forja*.zip
            Forja*.exe
          if-no-files-found: error

  # macOS e fatiado em shards porque um runner so nao fecha os 36 plugins
  # universais dentro do teto de 6 h (medicao da sonda em run 41475070630:
  # subtree do rack 37 min, tres plugins pequenos 24 min, ~8 min por plugin).
  # macos-plan le ci/products.json e decide a matriz: se o trem declara
  # `macosShards` usamos eles; senao, um shard implicito com os pathFilters/
  # testRegex do proprio trem (o que basta para rack, minis, drumforge, piano,
  # traco e os trens de um plugin). macos-shard compila e testa cada shard em
  # paralelo e sobe um tar.gz com os bundles daquele subtree, preservando o
  # caminho relativo a build/. macos-merge baixa todos os shards, descompacta
  # num merged/ e aplica o mesmo empacotamento do job antigo (aggregate ou
  # packages[]). O trem da suite sem macosShards declarados parava com a
  # mensagem "nao cabe"; agora os 14 shards declaram em products.json.
  macos-plan:
    name: Plan macOS shards
    needs: resolve
    runs-on: ubuntu-22.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Read shards
        id: plan
        shell: bash
        env:
          SLUG: ${{ needs.resolve.outputs.slug }}
          TRAIN_PF: ${{ needs.resolve.outputs.pathFilters }}
          TRAIN_TR: ${{ needs.resolve.outputs.testRegex }}
        run: |
          set -euo pipefail
          # macosShards e opcional por trem. Para a suite, a chave e .suite;
          # para produtos, .[$s]. empty quando a chave nao existe.
          SHARDS=$(jq -c --arg s "$SLUG" '
            if $s == "suite" then .suite.macosShards
            else .[$s].macosShards end // empty' ci/products.json)
          if [ -z "$SHARDS" ]; then
            if [ -z "$TRAIN_PF" ]; then
              echo "::error::trem sem macosShards e sem pathFilters: nao cabe no teto de 6h do macOS"
              exit 1
            fi
            SHARDS=$(jq -cn --arg pf "$TRAIN_PF" --arg tr "$TRAIN_TR" \
              '[{name: "full", pathFilters: ($pf | split(",")), testRegex: $tr}]')
          fi
          N=$(echo "$SHARDS" | jq 'length')
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "plan: $N shard(s) de macOS"

  macos-shard:
    name: macOS (${{ matrix.shard.name }})
    needs: [resolve, macos-plan]
    runs-on: macos-15
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.macos-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFORJA_LTO=OFF
          -DFORJA_STANDALONE=OFF

      - name: Build
        run: |
          set -euo pipefail
          FILTERS=$(jq -r '.[]' <<< '${{ toJson(matrix.shard.pathFilters) }}')
          for filtro in $FILTERS; do
            echo "::group::$filtro"
            cmake --build "build/$filtro" --parallel 2>&1 | tee -a build-macos.log
            echo "::endgroup::"
          done

      - name: Test
        run: |
          set -euo pipefail
          REGEX='${{ matrix.shard.testRegex }}'
          if [ -z "$REGEX" ]; then
            echo "sem testRegex neste shard"
            exit 0
          fi
          # Mesma guarda do job antigo: o alvo CMake e "forja_<nome>" e o
          # ctest -N sabe os nomes; parity_legacy e a excecao que falha a
          # regra e por isso a checagem de presenca existe.
          nomes=$(ctest --test-dir build -N -R "$REGEX" |
            sed -n 's/^[[:space:]]*Test[[:space:]]*#[[:space:]]*[0-9]*:[[:space:]]*//p' |
            tr -d '\r')
          if [ -z "$nomes" ]; then
            echo "::error::nenhum teste casa com '$REGEX' de ci/products.json"
            exit 1
          fi
          for nome in $nomes; do
            alvo="forja_$nome"
            cmake --build build --target "$alvo" --parallel 2>&1 | tee -a test-macos.log
          done
          ctest --test-dir build -R "$REGEX" --output-on-failure 2>&1 | tee -a test-macos.log

      - name: Mostrar a falha
        if: failure()
        uses: ./.github/actions/diagnostico
        with:
          logs: build-macos.log test-macos.log
          titulo: macOS shard ${{ matrix.shard.name }} falhou

      - name: Package shard
        run: |
          set -euo pipefail
          # Cada shard sobe um tar.gz com os bundles que construiu, mantendo
          # o caminho relativo a build/. O merge junta tudo e so ai aplica o
          # filtro packages/aggregate -- assim o merge sabe de qual subtree
          # veio cada .vst3.
          rm -rf shard
          mkdir -p shard
          FILTERS=$(jq -r '.[]' <<< '${{ toJson(matrix.shard.pathFilters) }}')
          while IFS= read -r bundle; do
            rel="${bundle#build/}"
            for f in $FILTERS; do
              case "$rel" in
                "$f"*)
                  mkdir -p "shard/$(dirname "$rel")"
                  cp -R "$bundle" "shard/$rel"
                  break
                  ;;
              esac
            done
          done < <(find build -type d -name "*.vst3" -path "*_artefacts*" | sort)
          (cd shard && tar czf "../macos-shard-${{ matrix.shard.name }}.tar.gz" .)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-shard-${{ matrix.shard.name }}
          path: macos-shard-${{ matrix.shard.name }}.tar.gz
          if-no-files-found: error

  macos-merge:
    name: Merge macOS shards
    needs: [resolve, macos-plan, macos-shard]
    # always() + checagem explicita: se um shard falhou, nao ha o que juntar,
    # mas o job ainda precisa aparecer como "skipped" para o release ver o
    # resultado dos outros SOs.
    if: always() && needs.macos-shard.result == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-shard-*
          path: shards
          merge-multiple: false

      - name: Merge and package
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve.outputs.version }}'
          BASE='${{ needs.resolve.outputs.artifactBase }}'
          KIND='${{ needs.resolve.outputs.kind }}'
          LEIAM='${{ needs.resolve.outputs.leiam }}'
          PKGS='${{ needs.resolve.outputs.packages }}'
          rm -rf merged
          mkdir -p merged
          for t in $(find shards -name "*.tar.gz" | sort); do
            tar xzf "$t" -C merged/
          done
          NPKGS=$(echo "$PKGS" | jq 'length')
          if [ "$NPKGS" -gt 0 ]; then
            # Um zip por plugin no mesmo tag; o pathFilter do package e o
            # prefixo do caminho relativo a build/ (preservado no tar.gz do
            # shard), entao o filtro casa direto.
            for i in $(seq 0 $((NPKGS - 1))); do
              SLUG=$(echo "$PKGS" | jq -r ".[$i].slug")
              PF=$(echo "$PKGS" | jq -r ".[$i].pathFilter")
              PBASE=$(echo "$PKGS" | jq -r ".[$i].artifactBase")
              PLEIAM=$(echo "$PKGS" | jq -r ".[$i].readme")
              echo "::group::package $SLUG"
              rm -rf package
              mkdir -p package/VST3
              while IFS= read -r bundle; do
                rel="${bundle#merged/}"
                case "$rel" in "$PF"*) cp -R "$bundle" package/VST3/ ;; esac
              done < <(find merged -type d -name "*.vst3" -path "*_artefacts*" | sort)
              cp "$PLEIAM" package/LEIA-ME.txt
              (cd package && zip -qry "../${PBASE}-${VERSION}-macos-universal.zip" .)
              echo "::endgroup::"
            done
          else
            rm -rf package
            mkdir -p package/VST3
            while IFS= read -r bundle; do
              cp -R "$bundle" package/VST3/
            done < <(find merged -type d -name "*.vst3" -path "*_artefacts*" | sort)
            if [ "$KIND" = suite ]; then
              cp docs/instalar/INSTALAR-MACOS.txt package/LEIA-ME.txt
            else
              cp "$LEIAM" package/LEIA-ME.txt
            fi
            (cd package && zip -qry "../${BASE}-${VERSION}-macos-universal.zip" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: forja-macos-universal
          path: Forja*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev \
            libxi-dev libgtk-3-dev \
            libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev \
            libcurl4-openssl-dev xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORJA_LTO=OFF -DFORJA_STANDALONE=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build-linux.log

      # xvfb-run: os testes que tocam MessageManager/PluginFormatManager/editor
      # (rack hosted, vst3_midi, canivete em gaveta, minidrum, pianoforge)
      # abortam sem DISPLAY no runner; o X virtual resolve todos de uma vez.
      - name: Test
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build --output-on-failure 2>&1 | tee test-linux.log || {
            # O ctest resume com "exit 8" para erro interno (teste Not Run,
            # binario ausente, timeout de IO) e nao nomeia a causa no bloco
            # FAILED:. As linhas proprias dos harnesses ("FAIL <modelo> ...")
            # e os marcadores *** vem ANTES do resumo, entao viram anotacao.
            grep -E '^FAIL |Parity suite|tests passed|Not Run|Could not find|Timeout|Exception|Aborted|Segmentation|\*\*\*|Errors while' test-linux.log | head -n 30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

      - name: Mostrar a falha
        if: failure()
        uses: ./.github/actions/diagnostico
        with:
          logs: test-linux.log build-linux.log
          titulo: Linux falhou

      - name: Package
        run: |
          set -euo pipefail
          VERSION='${{ needs.resolve.outputs.version }}'
          PKGS='${{ needs.resolve.outputs.packages }}'
          NPKGS=$(echo "$PKGS" | jq 'length')
          if [ "$NPKGS" -gt 0 ]; then
            # Espelho do job de macOS: um zip por plugin, sem aggregate.
            for i in $(seq 0 $((NPKGS - 1))); do
              SLUG=$(echo "$PKGS" | jq -r ".[$i].slug")
              PF=$(echo "$PKGS" | jq -r ".[$i].pathFilter")
              BASE=$(echo "$PKGS" | jq -r ".[$i].artifactBase")
              LEIAM=$(echo "$PKGS" | jq -r ".[$i].readme")
              echo "::group::package $SLUG"
              rm -rf package
              mkdir -p package/VST3
              while IFS= read -r bundle; do
                rel="${bundle#build/}"
                case "$rel" in "$PF"*) cp -R "$bundle" package/VST3/ ;; esac
              done < <(find build -type d -name "*.vst3" -path "*_artefacts*" | sort)
              cp "$LEIAM" package/LEIA-ME.txt
              (cd package && zip -qry "../${BASE}-${VERSION}-linux-x64.zip" .)
              echo "::endgroup::"
            done
          else
            mkdir -p package/VST3
            FILTERS='${{ needs.resolve.outputs.pathFilters }}'
            while IFS= read -r bundle; do
              rel="${bundle#build/}"
              if [ -z "$FILTERS" ]; then
                cp -R "$bundle" package/VST3/
                continue
              fi
              IFS=','; for filter in $FILTERS; do
                case "$rel" in "$filter"*) cp -R "$bundle" package/VST3/ ;; esac
              done
            done < <(find build -type d -name "*.vst3" -path "*_artefacts*" | sort)
            if [ '${{ needs.resolve.outputs.kind }}' = suite ]; then
              cp docs/instalar/INSTALAR-LINUX.txt package/LEIA-ME.txt
            else
              cp '${{ needs.resolve.outputs.leiam }}' package/LEIA-ME.txt
            fi
            cd package
            zip -qry "../${{ needs.resolve.outputs.artifactBase }}-${VERSION}-linux-x64.zip" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: forja-linux-x64
          path: Forja*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [resolve, windows, macos-merge, linux]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
