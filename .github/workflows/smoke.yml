name: Smoke

# Guardado rapido no compilador da CI de release (GCC do Ubuntu 22.04).
# A suite compila em MSVC e clang sem problema e so quebrava no Linux depois de
# taggear -- duas vezes seguidas (v0.5.1 e vrack-1.0.0) o job inteiro morreu em
# ForjaKnob.h por um default argument que o GCC rejeita. Este workflow roda no
# MESMO runner da CI de release, compile de um plugin so, e dispara em push nas
# fontes compartilhadas: erro de compilador cruzado aparece em ~5 minutos, nao
# 25, e antes de qualquer tag.
# Repositorio publico: minutos de Actions sao gratis, entao o custo e so tempo.

on:
  push:
    branches:
      - main
    paths:
      - "Forja/Source/**"
      # O CMake da forja_ui (e qualquer .cmake dela) muda o link dos 36 plugins:
      # uma propriedade ausente aqui reprova o Linux inteiro e o MSVC nao avisa.
      - "Forja/CMakeLists.txt"
      - "Forja/**/*.cmake"
      - "Airwindows/Eq/Cinzel/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build (GCC)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev \
            libxi-dev \
            libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORJA_LTO=OFF -DFORJA_STANDALONE=OFF

      # Um plugin basta: ele puxa forja_ui inteiro (chrome, knobs, cards, painel
      # FUNDAMENTOS) e os adapters header-only, que e onde um default argument
      # invalido aparece.
      - name: Build Cinzel_VST3
        run: |
          set -o pipefail
          # O log fica em arquivo para o passo de diagnostico poder resumir o
          # erro: num repositorio publico a API de job log pede token, entao sem
          # anotacao nao ha como ver o que o GCC reprovou sem abrir a pagina.
          cmake --build build --target Cinzel_VST3 --parallel 2>&1 | tee build-smoke.log

      - name: Show the compiler errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          # Num repositorio publico o log bruto so aparece para quem tem sessao
          # (a pagina mostra "Sign in to view logs" e a API responde 403), entao o
          # unico canal que sobra para diagnosticar sao as anotacoes do check-run.
          # Do `FAILED:` para o fim do log vem o comando completo e a mensagem do
          # toolchain (o `ld` fala em linhas que nao contém "error:", entao só o
          # grep de padrão perderia a causa).
          bloco=$(sed -n '/FAILED:/,$p' build-smoke.log | head -n 60)
          if [ -z "$bloco" ]; then bloco=$(tail -n 40 build-smoke.log); fi
          {
            echo '### Smoke falhou no GCC -- do primeiro FAILED ao fim do log'
            echo '```'
            printf '%s\n' "$bloco"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$bloco" | head -n 25 | cut -c1-500 | sed 's/%/%25/g; s/\r//g' | while IFS= read -r linha; do
            echo "::error::${linha}"
          done

      - name: Guard against the brace-init pattern that GCC rejects
        shell: bash
        run: |
          set -euo pipefail
          # Dois formatos derrubam o job Linux inteiro e nem MSVC nem clang avisam:
          # (1) um default argument escrito "Options options = {}" e (2) o aggregate
          # Options morando DENTRO de ForjaKnob -- o GCC exige os default member
          # initializers de um tipo aninhado antes do fim da classe envolvente e
          # reprova o default argument. O formato aceito e ForjaKnobOptions em
          # namespace + "using Options = ForjaKnobOptions" + default Options().
          # NAO resolver com construtor: os editores passam listas parciais
          # ({ 130, true }) e um construtor de quatro argumentos reprovava todas
          # elas com C2665 no MSVC. Options precisa continuar aggregate.
          if grep -rn -E 'Options\s+[A-Za-z_]+\s*=\s*\{\}' Forja/Source/forja/ui/*.h; then
            echo "::error::default argument 'Options x = {}' em Forja/Source/forja/ui -- o GCC do runner reprova. Use Options() mantendo o aggregate."
            exit 1
          fi
          if grep -rn -E 'Options\s*\(\s*\)\s*[;:{]|^\s*Options\s*\(' Forja/Source/forja/ui/ForjaKnob.h; then
            echo "::error::ForjaKnob::Options ganhou construtor: os editores usam listas parciais e o MSVC reprova. Mantenha aggregate."
            exit 1
          fi
          if grep -rn -E '^\s*struct Options\b' Forja/Source/forja/ui/ForjaKnob.h; then
            echo "::error::Options voltou a ser tipo aninhado em ForjaKnob: o GCC reprova o default argument (use ForjaKnobOptions em namespace)."
            exit 1
          fi
          echo "OK: ForjaKnob::Options e aggregate de namespace com default Options()."
